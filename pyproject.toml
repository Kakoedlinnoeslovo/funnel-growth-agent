[project]
name = "funnel-growth-agent"
version = "0.1.0"
description = "Propose and apply landing CTA experiments for recraft-pricing-lab"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "google-genai>=1.0",
    "httpx>=0.27",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "ruamel.yaml>=0.18",
    "typer>=0.12",
    "yt-dlp>=2026.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.13",
]

[project.scripts]
funnel-growth = "funnel_growth_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/funnel_growth_agent"]

[tool.hatch.build.targets.wheel.force-include]
"src/funnel_growth_agent/instructions.md" = "funnel_growth_agent/instructions.md"
"src/funnel_growth_agent/playbook.md" = "funnel_growth_agent/playbook.md"
"src/funnel_growth_agent/youtube_catalog.json" = "funnel_growth_agent/youtube_catalog.json"
"src/funnel_growth_agent/demo/console.html" = "funnel_growth_agent/demo/console.html"
"src/funnel_growth_agent/demo/workflow.html" = "funnel_growth_agent/demo/workflow.html"
"src/funnel_growth_agent/demo/workflow.js" = "funnel_growth_agent/demo/workflow.js"
"src/funnel_growth_agent/demo/workflow.css" = "funnel_growth_agent/demo/workflow.css"
"src/funnel_growth_agent/demo/instrument-sans.woff2" = "funnel_growth_agent/demo/instrument-sans.woff2"
"src/funnel_growth_agent/demo/instrument-sans-OFL.txt" = "funnel_growth_agent/demo/instrument-sans-OFL.txt"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["funnel_growth_agent", "conftest", "redesign_helpers"]
